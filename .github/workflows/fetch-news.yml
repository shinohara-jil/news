name: 毎日ニュース取得

on:
  # 毎日日本時間16時に実行（UTC 7時）
  schedule:
    - cron: '0 7 * * *'
  # 手動実行も可能
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - name: ニュース取得APIを呼び出し
        run: |
          echo "ニュース取得を開始します..."

          # 環境変数のチェック
          if [ -z "${{ secrets.APP_URL }}" ]; then
            echo "❌ エラー: APP_URLが設定されていません"
            echo ""
            echo "GitHub Secretsに以下を設定してください:"
            echo "  Name: APP_URL"
            echo "  Secret: https://your-app.vercel.app (末尾のスラッシュなし)"
            exit 1
          fi

          if [ -z "${{ secrets.ADMIN_SECRET_KEY }}" ]; then
            echo "❌ エラー: ADMIN_SECRET_KEYが設定されていません"
            echo ""
            echo "GitHub Secretsに以下を設定してください:"
            echo "  Name: ADMIN_SECRET_KEY"
            echo "  Secret: .env.localのADMIN_SECRET_KEYと同じ値"
            exit 1
          fi

          # 変数に代入して前後の空白を削除
          app_url=$(echo "${{ secrets.APP_URL }}" | xargs)
          admin_key=$(echo "${{ secrets.ADMIN_SECRET_KEY }}" | xargs)

          # 末尾のスラッシュを削除
          app_url="${app_url%/}"

          echo "APP_URL: $app_url"
          echo "APP_URL文字数: ${#app_url}"

          # URLの形式チェック
          if [[ ! "$app_url" =~ ^https?:// ]]; then
            echo ""
            echo "❌ エラー: APP_URLがhttp://またはhttps://で始まっていません"
            echo "現在の値: $app_url"
            exit 1
          fi

          echo "✓ URLの形式は正しいです"

          # エラー時もスクリプトを継続
          set +e

          # 完全なURLを構築
          full_url="${app_url}/api/fetch-news?key=${admin_key}&count=3"
          echo ""
          echo "APIを呼び出し中..."

          # APIエンドポイントを呼び出し（リダイレクトを追跡）
          response=$(curl -L --max-redirs 10 -s -w "\nHTTP_STATUS:%{http_code}" "$full_url")

          curl_exit_code=$?

          # HTTPステータスコードを抽出
          http_status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d: -f2 | tr -d '[:space:]')
          body=$(echo "$response" | sed '/HTTP_STATUS:/d')

          echo "HTTPステータスコード: $http_status"

          # HTTPステータスコードのチェック
          if [ -z "$http_status" ]; then
            echo ""
            echo "❌ エラー: HTTPステータスコードを取得できませんでした"
            echo "curlの終了コード: $curl_exit_code"
            exit 1
          fi

          if [ "$http_status" -ne 200 ]; then
            echo ""
            echo "❌ エラー: HTTPステータスコード $http_status"
            echo ""
            echo "レスポンス:"
            if command -v jq &> /dev/null; then
              echo "$body" | jq '.' 2>/dev/null || echo "$body"
            else
              echo "$body"
            fi
            exit 1
          fi

          echo ""
          echo "レスポンス:"
          if command -v jq &> /dev/null; then
            echo "$body" | jq '.' 2>/dev/null || echo "$body"
          else
            echo "$body"
          fi

          echo ""
          echo "✅ ニュース取得が完了しました!"
